[project]
name = "vulnlab"
version = "0.1.0"
description = "vulnlab.dev — intentionally vulnerable web labs for testing security tools"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=23.0",
    "requests>=2.32",
    "httpx>=0.27",
    "pygments>=2.18",
    "markupsafe>=2.1",
    "pycurl>=7.45",
    "pymysql>=1.1",
]

[tool.setuptools]
packages = ["apps"]
