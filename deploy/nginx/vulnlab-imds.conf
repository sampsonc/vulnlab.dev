# Mock AWS IMDS at 169.254.169.254:80 — only reachable from within the host.
# 169.254.169.254 is added to the loopback interface by systemd-networkd,
# so this listen directive matches a local IP only — never traverses the network.
#
# This vhost proxies to the metadata-mock gunicorn at 127.0.0.1:8169.

server {
    listen 169.254.169.254:80;
    server_name _;

    access_log /var/log/nginx/vulnlab-imds.access.log;
    error_log  /var/log/nginx/vulnlab-imds.error.log;

    location / {
        proxy_pass http://127.0.0.1:8169;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
}
