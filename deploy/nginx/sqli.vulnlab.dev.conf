# sqli.vulnlab.dev — intentionally vulnerable SQLi labs.
# Proxy to gunicorn at 127.0.0.1:8084. certbot --nginx injects 443 block on first run.
#
# Note: DO NOT add WAF rules, CSP, or other defensive headers here. The
# labs are intentionally vulnerable; filtering would mask the exact
# behavior tools are meant to detect.

limit_req_zone $binary_remote_addr zone=vulnlab_sqli:10m rate=2r/s;

server {
    server_name sqli.vulnlab.dev;

    client_max_body_size 64k;

    # ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        limit_req zone=vulnlab_sqli burst=30 nodelay;
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Time-based blind lab can run up to a few seconds per request.
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sqli.vulnlab.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sqli.vulnlab.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = sqli.vulnlab.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name sqli.vulnlab.dev;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}