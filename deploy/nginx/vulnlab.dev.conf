# vulnlab.dev — landing page (proxy to gunicorn at 127.0.0.1:8081).
# certbot --nginx will inject the 443 server block alongside this on first run.

limit_req_zone $binary_remote_addr zone=vulnlab_landing:10m rate=2r/s;

server {
    server_name vulnlab.dev www.vulnlab.dev;

    # ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        limit_req zone=vulnlab_landing burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vulnlab.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vulnlab.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.vulnlab.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = vulnlab.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vulnlab.dev www.vulnlab.dev;
    return 404; # managed by Certbot




}