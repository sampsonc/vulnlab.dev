# ssti.vulnlab.dev — intentionally vulnerable SSTI labs.
# Proxy to gunicorn at 127.0.0.1:8085. certbot --nginx injects 443 block on first run.

limit_req_zone $binary_remote_addr zone=vulnlab_ssti:10m rate=2r/s;

server {
    server_name ssti.vulnlab.dev;

    client_max_body_size 64k;

    # ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        limit_req zone=vulnlab_ssti burst=30 nodelay;
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ssti.vulnlab.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ssti.vulnlab.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ssti.vulnlab.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name ssti.vulnlab.dev;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}